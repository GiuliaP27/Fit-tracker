
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); }

.app { max-width: 680px; padding: 0; }

.header { padding: 16px 0 12px; border-bottom: 0.5px solid var(--color-border-tertiary); margin-bottom: 16px; }
.header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.split-title { font-size: 18px; font-weight: 500; color: var(--color-text-primary); }
.split-date { font-size: 12px; color: var(--color-text-secondary); }

.split-nav { display: flex; gap: 6px; }
.split-btn { padding: 5px 14px; font-size: 13px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: transparent; color: var(--color-text-secondary); cursor: pointer; transition: all 0.15s; font-family: var(--font-sans); }
.split-btn:hover { background: var(--color-background-secondary); color: var(--color-text-primary); }
.split-btn.active { background: var(--color-text-primary); color: var(--color-background-primary); border-color: var(--color-text-primary); }

.progress-bar-wrap { height: 3px; background: var(--color-border-tertiary); border-radius: 2px; margin-top: 12px; }
.progress-bar-fill { height: 100%; border-radius: 2px; background: var(--color-text-primary); transition: width 0.3s; }

.exercise-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); margin-bottom: 10px; overflow: hidden; }

.ex-header { padding: 12px 14px 10px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
.ex-header:hover { background: var(--color-background-secondary); }

.ex-left { display: flex; align-items: center; gap: 10px; }
.ex-badge { width: 28px; height: 28px; border-radius: 50%; background: var(--color-background-secondary); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; color: var(--color-text-secondary); flex-shrink: 0; }
.ex-badge.done { background: #EAF3DE; color: #3B6D11; }

.ex-name { font-size: 14px; font-weight: 500; color: var(--color-text-primary); }
.ex-meta { font-size: 11px; color: var(--color-text-secondary); margin-top: 2px; }
.ex-meta span { margin-right: 8px; }

.ex-right { display: flex; align-items: center; gap: 8px; }
.tech-badge { font-size: 10px; padding: 2px 8px; border-radius: 4px; background: var(--color-background-info); color: var(--color-text-info); font-weight: 500; white-space: nowrap; }
.chevron { font-size: 10px; color: var(--color-text-secondary); transition: transform 0.2s; }
.chevron.open { transform: rotate(180deg); }

.ex-body { display: none; padding: 0 14px 14px; border-top: 0.5px solid var(--color-border-tertiary); }
.ex-body.open { display: block; }

.coach-note { font-size: 12px; color: var(--color-text-secondary); background: var(--color-background-secondary); padding: 8px 10px; border-radius: var(--border-radius-md); margin: 10px 0 12px; line-height: 1.5; }

.sets-header { display: grid; grid-template-columns: 32px 1fr 1fr; gap: 6px; margin-bottom: 6px; padding: 0 2px; }
.sets-header span { font-size: 11px; color: var(--color-text-secondary); font-weight: 500; }

.set-row { display: grid; grid-template-columns: 32px 1fr 1fr; gap: 6px; margin-bottom: 6px; align-items: center; }

.set-num { font-size: 12px; color: var(--color-text-secondary); font-weight: 500; text-align: center; padding-top: 2px; }

.input-group { position: relative; }
.input-group input { width: 100%; padding: 7px 10px; font-size: 14px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: var(--color-background-primary); color: var(--color-text-primary); font-family: var(--font-sans); text-align: center; }
.input-group input:focus { outline: none; border-color: var(--color-border-primary); box-shadow: 0 0 0 2px rgba(0,0,0,0.06); }
.input-group input.filled { border-color: var(--color-border-tertiary); }

.prev-label { display: flex; justify-content: space-between; margin-top: 3px; padding: 0 2px; }
.prev-val { font-size: 10px; color: var(--color-text-secondary); }
.delta { font-size: 10px; font-weight: 500; }
.delta.up { color: #3B6D11; }
.delta.down { color: #993C1D; }
.delta.eq { color: var(--color-text-secondary); }

.set-row.complete .input-group input { background: var(--color-background-secondary); }

.complete-btn { width: 100%; margin-top: 12px; padding: 9px; font-size: 13px; font-weight: 500; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: transparent; color: var(--color-text-primary); cursor: pointer; font-family: var(--font-sans); transition: all 0.15s; }
.complete-btn:hover { background: var(--color-background-secondary); }
.complete-btn.done-btn { background: var(--color-text-primary); color: var(--color-background-primary); border-color: var(--color-text-primary); }

.finish-bar { position: sticky; bottom: 0; padding: 12px 0 4px; background: var(--color-background-primary); border-top: 0.5px solid var(--color-border-tertiary); margin-top: 4px; }
.finish-btn { width: 100%; padding: 12px; font-size: 14px; font-weight: 500; border: none; border-radius: var(--border-radius-lg); background: var(--color-text-primary); color: var(--color-background-primary); cursor: pointer; font-family: var(--font-sans); transition: opacity 0.2s; }
.finish-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.finish-btn:not(:disabled):hover { opacity: 0.85; }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--color-text-primary); color: var(--color-background-primary); padding: 10px 20px; border-radius: var(--border-radius-md); font-size: 13px; font-weight: 500; display: none; z-index: 999; white-space: nowrap; }
.toast.show { display: block; }

.warmup-tag { font-size: 10px; padding: 2px 6px; background: #FAEEDA; color: #854F0B; border-radius: 4px; font-weight: 500; }
</style>

<h2 class="sr-only">App di tracciamento allenamento con progressione dei carichi per 3 split settimanali</h2>

<div class="app">
  <div class="header">
    <div class="header-top">
      <div>
        <div class="split-title" id="splitTitle">Split 1</div>
        <div class="split-date" id="splitDate"></div>
      </div>
      <div class="split-nav">
        <button class="split-btn active" onclick="loadSplit(0)">S1</button>
        <button class="split-btn" onclick="loadSplit(1)">S2</button>
        <button class="split-btn" onclick="loadSplit(2)">S3</button>
      </div>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
    </div>
  </div>

  <div id="exerciseList"></div>

  <div class="finish-bar">
    <button class="finish-btn" id="finishBtn" disabled onclick="finishWorkout()">Completa allenamento</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SPLITS = [
  {
    name: "Split 1",
    exercises: [
      { name: "Open Book", tech: null, note: "A terra. Respiri profondi. Alternando destra e sinistra, ma almeno 5 minuti", sets: null, repGoal: null, rest: null, warmup: true },
      { name: "Gatto-Mucca", tech: null, note: "Massimo allungamento e accorciamento della colonna. Movimenti lenti e completi. Una reps vale il doppio movimento", sets: 3, repGoal: "10", rest: "60″" },
      { name: "Affondo Indietro Statico", tech: null, note: "Rimani in affondo con torsione del busto, anche con appoggio. 20-30″ per lato × 3 volte", sets: 3, repGoal: "30″", rest: "30-45″" },
      { name: "Alzate Laterali", tech: "To Failure", note: "In piedi", sets: 3, repGoal: "15RM", rest: "60-75″" },
      { name: "Affondo Indietro + Squat", tech: "To Failure", note: "A corpo libero, eventualmente con KB. Affondo DX, affondo SX e uno squat. Soli contano gli squat", sets: 3, repGoal: "8-10", rest: "75-90″" },
      { name: "Lento Avanti Manubri", tech: "Working Set", note: "Singolo. Manubrio. Seduta senza schienale. Video", sets: 3, repGoal: "10-12", rest: "75-90″" },
      { name: "Leg Extension", tech: "Straight Sets", note: "Movimenti controllati e completi. Piedi a martello durante tutta l'esecuzione", sets: 3, repGoal: "8-10", rest: "90-120″" },
      { name: "Push Down", tech: "Working Set", note: "Corda o Vulken. In piedi", sets: 3, repGoal: "10-12", rest: "75-90″" },
      { name: "Crunch", tech: "To Failure", note: "Gambe piegate", sets: 3, repGoal: "12-15", rest: "45-60″" },
    ]
  },
  {
    name: "Split 2",
    exercises: [
      { name: "Open Book", tech: null, note: "A terra. Respiri profondi. Alternando destra e sinistra, ma almeno 5 minuti", sets: null, repGoal: null, rest: null, warmup: true },
      { name: "Gatto-Mucca", tech: null, note: "Massimo allungamento e accorciamento della colonna. Movimenti lenti e completi", sets: 3, repGoal: "10", rest: "60″" },
      { name: "Affondo Indietro Statico", tech: null, note: "Rimani in affondo con torsione del busto, anche con appoggio. 20-30″ per lato × 3 volte", sets: 3, repGoal: "30″", rest: "30-45″" },
      { name: "Lat Machine", tech: "Working Set", note: "Singolo. Maniglia. Video. Massimo allungamento", sets: 3, repGoal: "10-12", rest: "75-90″" },
      { name: "Split Squat", tech: "Straight Sets", note: "Manubrio nella mano opposta della gamba che spinge. Entrambi i piedi a terra, senza tornare a piedi pari. Passo lungo e profondo", sets: 3, repGoal: "8-10", rest: "90-120″" },
      { name: "Rematore Manubrio", tech: "Working Set", note: "In appoggio su panca. Video", sets: 3, repGoal: "10-12", rest: "90-120″" },
      { name: "RDL", tech: "To Failure", note: "Video. Manubri", sets: 3, repGoal: "15RM", rest: "90-120″" },
      { name: "Hammer Curl", tech: "Straight Sets", note: "In piedi. In coppia", sets: 3, repGoal: "8-10", rest: "90-120″" },
      { name: "Side Plank", tech: "To Failure", note: "In appoggio su gomito", sets: 3, repGoal: "MAX", rest: "45-60″" },
    ]
  },
  {
    name: "Split 3",
    exercises: [
      { name: "Open Book", tech: null, note: "A terra. Respiri profondi. Alternando destra e sinistra, ma almeno 5 minuti", sets: null, repGoal: null, rest: null, warmup: true },
      { name: "Gatto-Mucca", tech: null, note: "Massimo allungamento e accorciamento della colonna. Movimenti lenti e completi", sets: 3, repGoal: "10", rest: "60″" },
      { name: "Affondo Indietro Statico", tech: null, note: "Rimani in affondo con torsione del busto, anche con appoggio. 20-30″ per lato × 3 volte", sets: 3, repGoal: "30″", rest: "30-45″" },
      { name: "Pulley Basso", tech: "Straight Sets", note: "Triangolo. Video", sets: 3, repGoal: "10-12", rest: "75-90″" },
      { name: "Leg Curl", tech: "Working Set", note: "Movimenti controllati e completi. No strattoni", sets: 3, repGoal: "8-10", rest: "75-90″" },
      { name: "Renegare Row", tech: "Straight Sets", note: "Posizione di plank, ma a braccia tese. Un braccio per volta", sets: 3, repGoal: "8-10", rest: "90-120″" },
      { name: "Russian Swing", tech: "To Failure", note: "KB da 8. Belle contrazioni del gluteo ad ogni reps", sets: 3, repGoal: "10-12", rest: "75-90″" },
      { name: "Distensioni Panca Inclinata", tech: "To Failure", note: "Manubri. Panca 45°. Video", sets: 3, repGoal: "8-10", rest: "90-120″" },
      { name: "Crunch Inverso", tech: "To Failure", note: "Gambe tese e mani sotto i glutei. Movimenti lenti soprattutto a scendere", sets: 3, repGoal: "10-12", rest: "45-60″" },
    ]
  }
];

let currentSplit = 0;
let state = {};

function storageKey(split, ex, set, field) {
  return `wt_s${split}_e${ex}_s${set}_${field}`;
}
function historyKey(split, ex, set, field) {
  return `wt_prev_s${split}_e${ex}_s${set}_${field}`;
}

async function saveVal(key, val) {
  try { await window.storage.set(key, val); } catch(e) {}
}
async function loadVal(key) {
  try { const r = await window.storage.get(key); return r ? r.value : null; } catch(e) { return null; }
}

async function loadSplit(idx) {
  currentSplit = idx;
  document.querySelectorAll('.split-btn').forEach((b,i) => b.classList.toggle('active', i === idx));
  document.getElementById('splitTitle').textContent = SPLITS[idx].name;
  document.getElementById('splitDate').textContent = new Date().toLocaleDateString('it-IT', {weekday:'long', day:'numeric', month:'long'});
  state = {};
  await renderExercises();
}

async function renderExercises() {
  const split = SPLITS[currentSplit];
  const container = document.getElementById('exerciseList');
  container.innerHTML = '';

  for (let ei = 0; ei < split.exercises.length; ei++) {
    const ex = split.exercises[ei];
    const card = document.createElement('div');
    card.className = 'exercise-card';
    card.id = `ex-${ei}`;

    if (ex.warmup) {
      card.innerHTML = `
        <div class="ex-header" onclick="toggleEx(${ei})">
          <div class="ex-left">
            <div class="ex-badge" id="badge-${ei}">~</div>
            <div>
              <div class="ex-name">${ex.name}</div>
              <div class="ex-meta"><span class="warmup-tag">riscaldamento</span></div>
            </div>
          </div>
          <div class="ex-right"><span class="chevron" id="chev-${ei}">▼</span></div>
        </div>
        <div class="ex-body" id="body-${ei}">
          <div class="coach-note">${ex.note}</div>
          <button class="complete-btn" onclick="markWarmupDone(${ei})">Fatto ✓</button>
        </div>`;
    } else {
      const setNums = ex.sets || 3;
      let setRows = '';
      const prevData = [];
      const curData = [];

      for (let si = 0; si < setNums; si++) {
        const pkgKey = storageKey(currentSplit, ei, si, 'kg');
        const prepKey = storageKey(currentSplit, ei, si, 'rep');
        const phkgKey = historyKey(currentSplit, ei, si, 'kg');
        const phrepKey = historyKey(currentSplit, ei, si, 'rep');

        const savedKg = await loadVal(pkgKey) || '';
        const savedRep = await loadVal(prepKey) || '';
        const prevKg = await loadVal(phkgKey) || '';
        const prevRep = await loadVal(phrepKey) || '';

        prevData.push({ kg: prevKg, rep: prevRep });
        curData.push({ kg: savedKg, rep: savedRep });

        const kgDelta = getDelta(savedKg, prevKg, 'kg');
        const repDelta = getDelta(savedRep, prevRep, 'rep');

        setRows += `
          <div class="set-row" id="setrow-${ei}-${si}">
            <div class="set-num">${si + 1}</div>
            <div class="input-group">
              <input type="number" inputmode="decimal" placeholder="kg" step="0.5"
                id="kg-${ei}-${si}" value="${savedKg}"
                onchange="handleInput(${ei},${si},'kg',this.value)"
                onfocus="this.select()" class="${savedKg ? 'filled' : ''}">
              <div class="prev-label">
                <span class="prev-val">${prevKg ? 'prec: ' + prevKg + ' kg' : 'nessun dato'}</span>
                ${savedKg && prevKg ? `<span class="delta ${kgDelta.cls}">${kgDelta.sym}</span>` : ''}
              </div>
            </div>
            <div class="input-group">
              <input type="text" inputmode="numeric" placeholder="rep"
                id="rep-${ei}-${si}" value="${savedRep}"
                onchange="handleInput(${ei},${si},'rep',this.value)"
                onfocus="this.select()" class="${savedRep ? 'filled' : ''}">
              <div class="prev-label">
                <span class="prev-val">${prevRep ? 'prec: ' + prevRep : 'nessun dato'}</span>
                ${savedRep && prevRep ? `<span class="delta ${repDelta.cls}">${repDelta.sym}</span>` : ''}
              </div>
            </div>
          </div>`;
      }

      const isDone = curData.every(d => d.kg && d.rep);

      card.innerHTML = `
        <div class="ex-header" onclick="toggleEx(${ei})">
          <div class="ex-left">
            <div class="ex-badge ${isDone ? 'done' : ''}" id="badge-${ei}">${isDone ? '✓' : ei + 1}</div>
            <div>
              <div class="ex-name">${ex.name}</div>
              <div class="ex-meta">
                <span>${ex.sets} set</span>
                <span>${ex.repGoal} rep</span>
                <span>rest ${ex.rest}</span>
              </div>
            </div>
          </div>
          <div class="ex-right">
            ${ex.tech ? `<span class="tech-badge">${ex.tech}</span>` : ''}
            <span class="chevron" id="chev-${ei}">▼</span>
          </div>
        </div>
        <div class="ex-body" id="body-${ei}">
          <div class="coach-note">${ex.note}</div>
          <div class="sets-header">
            <span></span><span>Kg</span><span>Reps</span>
          </div>
          ${setRows}
        </div>`;
    }

    container.appendChild(card);
  }

  updateProgress();
}

function getDelta(cur, prev, type) {
  if (!cur || !prev) return { cls: 'eq', sym: '' };
  const c = parseFloat(cur), p = parseFloat(prev);
  if (isNaN(c) || isNaN(p)) return { cls: 'eq', sym: '=' };
  if (c > p) return { cls: 'up', sym: '▲' };
  if (c < p) return { cls: 'down', sym: '▼' };
  return { cls: 'eq', sym: '=' };
}

function toggleEx(ei) {
  const body = document.getElementById(`body-${ei}`);
  const chev = document.getElementById(`chev-${ei}`);
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  chev.classList.toggle('open', !isOpen);
}

async function handleInput(ei, si, field, val) {
  const key = storageKey(currentSplit, ei, si, field);
  await saveVal(key, val);
  const input = document.getElementById(`${field}-${ei}-${si}`);
  if (input) input.classList.toggle('filled', !!val);

  const ex = SPLITS[currentSplit].exercises[ei];
  const setNums = ex.sets || 3;
  let allDone = true;
  for (let s = 0; s < setNums; s++) {
    const kg = document.getElementById(`kg-${ei}-${s}`);
    const rep = document.getElementById(`rep-${ei}-${s}`);
    if (!kg || !rep || !kg.value || !rep.value) { allDone = false; break; }
  }

  const badge = document.getElementById(`badge-${ei}`);
  if (badge) {
    badge.textContent = allDone ? '✓' : (ei + 1);
    badge.classList.toggle('done', allDone);
  }

  const prevKgKey = historyKey(currentSplit, ei, si, 'kg');
  const prevRepKey = historyKey(currentSplit, ei, si, 'rep');
  const prevKg = await loadVal(prevKgKey) || '';
  const prevRep = await loadVal(prevRepKey) || '';

  const curKg = document.getElementById(`kg-${ei}-${si}`)?.value || '';
  const curRep = document.getElementById(`rep-${ei}-${si}`)?.value || '';

  const kgDelta = getDelta(curKg, prevKg, 'kg');
  const repDelta = getDelta(curRep, prevRep, 'rep');

  const row = document.getElementById(`setrow-${ei}-${si}`);
  if (row) {
    const prevLabels = row.querySelectorAll('.prev-label');
    if (prevLabels[0]) {
      prevLabels[0].innerHTML = `<span class="prev-val">${prevKg ? 'prec: ' + prevKg + ' kg' : 'nessun dato'}</span>${curKg && prevKg ? `<span class="delta ${kgDelta.cls}">${kgDelta.sym}</span>` : ''}`;
    }
    if (prevLabels[1]) {
      prevLabels[1].innerHTML = `<span class="prev-val">${prevRep ? 'prec: ' + prevRep : 'nessun dato'}</span>${curRep && prevRep ? `<span class="delta ${repDelta.cls}">${repDelta.sym}</span>` : ''}`;
    }
  }

  updateProgress();
}

function markWarmupDone(ei) {
  const btn = document.querySelector(`#ex-${ei} .complete-btn`);
  if (btn) { btn.textContent = 'Completato ✓'; btn.classList.add('done-btn'); }
  const badge = document.getElementById(`badge-${ei}`);
  if (badge) { badge.textContent = '✓'; badge.classList.add('done'); }
  saveVal(storageKey(currentSplit, ei, 0, 'done'), '1');
  updateProgress();
}

async function updateProgress() {
  const split = SPLITS[currentSplit];
  let done = 0, total = split.exercises.length;

  for (let ei = 0; ei < split.exercises.length; ei++) {
    const ex = split.exercises[ei];
    if (ex.warmup) {
      const d = await loadVal(storageKey(currentSplit, ei, 0, 'done'));
      const badge = document.getElementById(`badge-${ei}`);
      if (badge && badge.textContent === '✓') done++;
      else if (d) done++;
    } else {
      const setNums = ex.sets || 3;
      let allDone = true;
      for (let s = 0; s < setNums; s++) {
        const kg = document.getElementById(`kg-${ei}-${s}`);
        const rep = document.getElementById(`rep-${ei}-${s}`);
        if (!kg || !rep || !kg.value || !rep.value) { allDone = false; break; }
      }
      if (allDone) done++;
    }
  }

  const pct = Math.round((done / total) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  const finishBtn = document.getElementById('finishBtn');
  finishBtn.disabled = done < total;
  finishBtn.textContent = done < total ? `Completa allenamento (${done}/${total})` : 'Salva allenamento ✓';
}

async function finishWorkout() {
  const split = SPLITS[currentSplit];
  for (let ei = 0; ei < split.exercises.length; ei++) {
    const ex = split.exercises[ei];
    if (!ex.warmup) {
      const setNums = ex.sets || 3;
      for (let si = 0; si < setNums; si++) {
        const kg = document.getElementById(`kg-${ei}-${si}`)?.value || '';
        const rep = document.getElementById(`rep-${ei}-${si}`)?.value || '';
        await saveVal(historyKey(currentSplit, ei, si, 'kg'), kg);
        await saveVal(historyKey(currentSplit, ei, si, 'rep'), rep);
      }
    }
  }
  showToast('Allenamento salvato! Dati aggiornati come riferimento');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

loadSplit(0);
</script>
